name: Windows build

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release executable
        run: cargo build --release --locked --bin pixel_craft

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PixelCraft-Windows
          path: target/release/pixel_craft.exe
          if-no-files-found: error
          retention-days: 14
